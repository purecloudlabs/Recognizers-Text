LangMarker: Hun
#Boolean Recognizers
TokenizerRegex: !simpleRegex
  def: '[^\w\d]'
SkinToneRegex: !simpleRegex
  def: '(\uD83C\uDFFB|\uD83C\uDFFC|\uD83C\uDFFD|\uD83C\uDFFE|\uD83C\uDFFF)'
TrueRegex: !nestedRegex
  def: \b(igaz|igen|persze|ja|jó|rendben|egyetértek)\b|(\uD83D\uDC4D|\uD83D\uDC4C|\u0001f44c){SkinToneRegex}?
  references: [ SkinToneRegex ]
FalseRegex: !nestedRegex
  def: \b(hamis|nem|dehogy|nope|nem\s+jó|nem\s+értek\s+egyet)\b|(\uD83D\uDC4E|\u270B|\uD83D\uDD90|\u0001F44E|\u0001F590){SkinToneRegex}?
  references: [ SkinToneRegex ]